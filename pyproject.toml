[project]
name = "shikigen-agent"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "langgraph-checkpoint-sqlite>=3.0.0",
    "aiosqlite>=0.22.1",
    "shikigen-harness",
    "fastapi>=0.141.1",
    "langchain>=1.3.14",
    "langgraph>=1.2.9",
    "pydantic>=2.13.4",
    "python-dotenv>=1.2.2",
    "uvicorn>=0.52.1",
]

[dependency-groups]
dev = [
    "ruff>=0.16.0",
]

[tool.ruff]
line-length = 88
target-version = "py312"
indent-width = 2

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.uv.workspace]
members = ["packages/harness"]

[tool.uv.sources]
shikigen-harness = { workspace = true }
