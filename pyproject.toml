[project]
name = "shikigen-agent"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.141.1",
    "httpx>=0.28.0",
    "langchain>=1.3.14",
    "langchain-core>=1.5.1",
    "langchain-deepseek>=1.1.0",
    "langchain-mcp-adapters>=0.3.2",
    "langgraph>=1.2.9",
    "langgraph-checkpoint-sqlite>=3.0.0",
    "markdownify>=1.2.0",
    "pydantic>=2.13.4",
    "python-dotenv>=1.2.2",
    "readabilipy>=0.3.0",
    "uvicorn>=0.52.1",
]

[dependency-groups]
dev = [
    "ruff>=0.16.0",
]

[tool.ruff]
line-length = 88
target-version = "py312"
indent-width = 2

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
