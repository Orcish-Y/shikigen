[project]
name = "shikigen-harness"
version = "0.2.0"
description = "Agent harness, runtime, middleware, and tools for Shikigen"
requires-python = ">=3.12"
dependencies = [
    "aiosqlite>=0.22.1",
    "httpx>=0.28.0",
    "jsonschema>=4.26.0",
    "langchain>=1.3.14",
    "langchain-core>=1.5.1",
    "langchain-deepseek>=1.1.0",
    "langchain-mcp-adapters>=0.3.2",
    "langgraph>=1.2.9",
    "langgraph-checkpoint-sqlite>=3.0.0",
    "markdownify>=1.2.0",
    "mcp>=1.29.0,<2",
    "portalocker==3.2.0",
    "pydantic>=2.13.4",
    "pyyaml>=6.0.3",
    "pywin32>=306 ; sys_platform == 'win32'",
    "readabilipy>=0.3.0",
    "referencing>=0.37.0",
    "tzdata>=2025.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["shikigen"]
