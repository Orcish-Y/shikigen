[project]
name = "shikigen-harness"
version = "0.1.0"
description = "Agent harness, runtime, middleware, and tools for Shikigen"
requires-python = ">=3.12"
dependencies = [
    "aiosqlite>=0.22.1",
    "httpx>=0.28.0",
    "langchain>=1.3.14",
    "langchain-core>=1.5.1",
    "langchain-deepseek>=1.1.0",
    "langchain-mcp-adapters>=0.3.2",
    "langgraph>=1.2.9",
    "langgraph-checkpoint-sqlite>=3.0.0",
    "markdownify>=1.2.0",
    "pydantic>=2.13.4",
    "readabilipy>=0.3.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["shikigen"]
